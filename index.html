<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8e6e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Расходы на авто</title>
<style>
:root{
  --bg:#e8e6e1; --surface:#eeede8; --sd:#c9c4bb; --sl:#ffffff;
  --text:#3f3e3b; --muted:#8a877f; --mint:#9fe3c4;
  --mintdark:#1f6b4d; --minttext:#1f4d3a; --ring:#57d7c8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:clamp(15px,4.2vw,17px); line-height:1.45;
  padding:14px 14px calc(120px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto;
}
.topbar{padding:6px 4px 14px;}
.topbar h1{font-size:clamp(24px,7vw,30px);font-weight:800;letter-spacing:-.5px;}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px;}
.view{display:none;}
.view.on{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.card{background:var(--surface);border-radius:26px;padding:18px;box-shadow:7px 7px 14px var(--sd),-7px -7px 14px var(--sl);margin-bottom:16px;}
.card h3{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}

.row{display:flex;gap:12px;}
.row>*{flex:1;min-width:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.field{
  background:var(--surface);border:none;width:100%;color:var(--text);
  border-radius:18px;padding:13px 16px;font-size:16px;font-family:inherit;
  box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);
}
.field:focus{outline:none;box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl),0 0 0 2.5px var(--ring);}
.field::placeholder{color:#b3b0a8;}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 2px 6px;}
label:first-child{margin-top:0;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);color:var(--text);border:none;cursor:pointer;
  border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;font-family:inherit;
  box-shadow:6px 6px 12px var(--sd),-6px -6px 12px var(--sl);
  transition:box-shadow .15s, transform .15s; user-select:none;
}
.btn:active{box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);transform:scale(.98);}
.btn-primary{background:linear-gradient(145deg,#aeeed3,#86d9b3);color:var(--minttext);}
.btn-primary:active{box-shadow:inset 4px 4px 8px #74c39c,inset -4px -4px 8px #c9f6df;}
.btn-danger{color:#a04343;}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn-block{width:100%;}

.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:none;cursor:pointer;border-radius:999px;padding:10px 15px;
  font-size:13.5px;font-weight:600;color:var(--text);font-family:inherit;
  box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl);
}
.chip.on{box-shadow:inset 3px 3px 7px #74c39c,inset -3px -3px 7px #c9f6df;background:var(--mint);color:var(--minttext);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}

.bottomnav{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  max-width:616px;margin:0 auto;height:66px;z-index:50;
  background:var(--surface);border-radius:30px;
  box-shadow:8px 8px 18px var(--sd),-8px -8px 18px var(--sl);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;
}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;padding:6px 0;}
.navbtn svg{width:24px;height:24px;}
.navbtn.on{color:var(--mintdark);}
.fab{
  width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;flex:none;
  background:linear-gradient(145deg,#aeeed3,#86d9b3);color:var(--minttext);
  box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);
  font-size:30px;line-height:1;margin-top:-30px;
  display:flex;align-items:center;justify-content:center;
}
.fab:active{box-shadow:inset 4px 4px 8px #74c39c,inset -4px -4px 8px #c9f6df;}

.avatar{
  width:96px;height:96px;border-radius:30px;object-fit:cover;flex:none;
  box-shadow:6px 6px 12px var(--sd),-6px -6px 12px var(--sl);
  background:var(--mint);display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;color:var(--minttext);overflow:hidden;
}
.carname{font-size:21px;font-weight:800;letter-spacing:-.3px;}
.caryear{color:var(--muted);font-size:14px;font-weight:600;}
.colordot{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 1px 1px 2px rgba(255,255,255,.6),1px 1px 3px var(--sd);}

.bar{height:16px;border-radius:999px;box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);overflow:hidden;margin:8px 0 6px;}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#8cdcb6,#a9ecd0);transition:width .4s;}

.stat{background:var(--surface);border-radius:20px;padding:13px 15px;box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:2px;}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;}

.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.chart .barv{width:100%;border-radius:12px;background:linear-gradient(180deg,#aeeed3,#8cdcb6);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),2px 2px 5px var(--sd);min-height:4px;}
.chart .ml{font-size:11px;color:var(--muted);font-weight:600;}

.rec{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:13px 15px;box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl);margin-bottom:10px;cursor:pointer;}
.rec .ic{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);}
.rec .tt{flex:1;min-width:0;}
.rec .tt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec .tt span{font-size:12px;color:var(--muted);}
.rec .am{font-weight:800;font-size:15px;white-space:nowrap;}

.swatch{width:38px;height:38px;border-radius:14px;border:none;cursor:pointer;box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);}
.swatch.on{box-shadow:inset 3px 3px 6px rgba(0,0,0,.25),0 0 0 3px var(--ring);}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;cursor:pointer;box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);}
.pgrid img:active{box-shadow:inset 3px 3px 6px var(--sd),0 0 0 3px var(--ring);}

.overlay{position:fixed;inset:0;background:rgba(60,58,52,.45);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.on{display:flex;}
.modal{
  background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(0,0,0,.18);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head b{font-size:19px;}
.xbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--surface);color:var(--muted);font-size:17px;font-weight:700;cursor:pointer;box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);}

.totalBox{
  border-radius:20px;padding:14px 16px;margin-top:14px;
  box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);
  display:flex;align-items:baseline;justify-content:space-between;
}
.totalBox .l{font-size:13px;color:var(--muted);font-weight:700;}
.totalBox .v{font-size:26px;font-weight:800;color:var(--mintdark);letter-spacing:-.5px;}

.checkline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px;font-weight:600;}
.switch{width:50px;height:28px;border-radius:999px;background:var(--surface);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);position:relative;cursor:pointer;flex:none;border:none;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sl);box-shadow:2px 2px 5px var(--sd);transition:.2s;}
.switch.on::after{left:25px;background:var(--mint2);}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#3f3e3b;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{text-align:center;color:var(--muted);padding:30px 10px;}
.empty .big{font-size:44px;margin-bottom:8px;}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px;}
.carline{display:flex;align-items:center;gap:14px;}
.carline .avatar{width:64px;height:64px;border-radius:22px;font-size:22px;}
.badge{font-size:11px;font-weight:800;color:var(--mintdark);background:var(--mint);border-radius:999px;padding:3px 10px;}
.sync-status{font-size:13px;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="pageTitle">Обзор</h1>
  <p id="pageSub">Учёт расходов на автомобиль</p>
</div>

<main id="view-overview" class="view on"></main>
<main id="view-history" class="view"></main>
<main id="view-garage" class="view"></main>
<main id="view-settings" class="view"></main>

<nav class="bottomnav">
  <button class="navbtn" data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Обзор</button>
  <button class="navbtn" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>История</button>
  <button class="fab" id="fabBtn">+</button>
  <button class="navbtn" data-tab="garage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21V9l9-5 9 5v12M7 21v-6h10v6M7 12h.01M17 12h.01"/></svg>Гараж</button>
  <button class="navbtn" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M4 7h16M4 12h16M4 17h16"/></svg>Ещё</button>
</nav>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
var CATS=[
 {k:'fuel',l:'Топливо',i:'⛽'},{k:'service',l:'ТО',i:'🔧'},{k:'repair',l:'Ремонт',i:'🛠'},
 {k:'tires',l:'Шины',i:'🛞'},{k:'insurance',l:'Страховка',i:'🛡'},{k:'tax',l:'Налоги',i:'🧾'},
 {k:'parking',l:'Парковка',i:'🅿'},{k:'wash',l:'Мойка',i:'🧼'},{k:'fine',l:'Штрафы',i:'⚠'},{k:'other',l:'Прочее',i:'•'}
];
var BRANDS=['Audi','BMW','BYD','Chery','Chevrolet','Citroen','Ford','Geely','Haval','Honda','Hyundai','Kia','Lada','Mazda','Mercedes-Benz','Mitsubishi','Nissan','Opel','Peugeot','Renault','Skoda','Suzuki','Tesla','Toyota','Volkswagen','Volvo','ВАЗ','ГАЗ','УАЗ'];
var COLORS=['#c94f4f','#e0923c','#d9c04a','#7cb96a','#4fb6a0','#4f8fc9','#6a6fd1','#a05fc9','#d15f9e','#8a6a4f','#8d9199','#2f3237'];

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
var state=load('carExpV1',null)||{cars:[],activeCar:null,updatedAt:0};
var settings=load('carExpSync',null)||{syncToken:'',syncGistId:'',syncOn:false,lastSync:0};
var monthFilter='',catFilter='',editingRec=null,editingCar=null,foundPhotos=[];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+' \u20BD';}
function num(n,d){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d==null?2:d}).format(n||0);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function catOf(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i];return CATS[9];}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2600);}

function save(){state.updatedAt=Date.now();try{localStorage.setItem('carExpV1',JSON.stringify(state));}catch(e){toast('Мало места: фото слишком велико');}schedulePush();}
function saveSettings(){localStorage.setItem('carExpSync',JSON.stringify(settings));}
function activeCar(){for(var i=0;i<state.cars.length;i++)if(state.cars[i].id===state.activeCar)return state.cars[i];return state.cars[0]||null;}

function fuelStats(car){
  var recs=car.records.filter(function(r){return r.cat==='fuel'&&r.odometer>0;})
    .sort(function(a,b){return a.odometer-b.odometer||(a.date<b.date?-1:1);});
  var prevFull=null,pending=0,segments=[],totalLiters=0,pendAfter=0;
  recs.forEach(function(r){
    totalLiters+=(r.liters||0);
    if(prevFull){
      pending+=(r.liters||0);
      if(r.full){
        if(r.odometer>prevFull.odometer){segments.push({fuel:pending,dist:r.odometer-prevFull.odometer});}
        prevFull=r;pending=0;
      }
    }else if(r.full){prevFull=r;pending=0;}
  });
  if(prevFull){pendAfter=pending;}
  var f=0,d=0;segments.forEach(function(s){f+=s.fuel;d+=s.dist;});
  var avg=d>0?f/d*100:0;
  var last=segments.length?segments[segments.length-1].fuel/segments[segments.length-1].dist*100:0;
  var maxOdo=recs.length?recs[recs.length-1].odometer:0;
  var totalAmount=0;car.records.forEach(function(r){if(r.cat==='fuel')totalAmount+=(r.amount||0);});
  var costKm=d>0?totalAmount/d:0;
  var remainPct=null,remainL=null;
  if(car.tank>0&&prevFull&&avg>0){
    var distSince=maxOdo-prevFull.odometer;
    var consumed=avg*distSince/100;
    var remain=Math.max(0,Math.min(car.tank,car.tank-consumed+pendAfter));
    remainL=remain;remainPct=remain/car.tank*100;
  }
  return{avg:avg,last:last,totalLiters:totalLiters,odo:maxOdo,costKm:costKm,unaccounted:pendAfter,remainL:remainL,remainPct:remainPct,hasOdo:recs.length>0};
}
function monthKey(iso){return iso.slice(0,7);}
function monthTotal(car,key){var s=0;car.records.forEach(function(r){if(monthKey(r.date)===key)s+=(r.amount||0);});return s;}
function monthCat(car,key){var m={};car.records.forEach(function(r){if(monthKey(r.date)===key)m[r.cat]=(m[r.cat]||0)+(r.amount||0);});return m;}
function allTotal(car){var s=0;car.records.forEach(function(r){s+=(r.amount||0);});return s;}

var TABS={overview:'Обзор',history:'История',garage:'Гараж',settings:'Ещё'};
var curTab='overview';
function switchTab(t){curTab=t;['overview','history','garage','settings'].forEach(function(v){document.getElementById('view-'+v).classList.toggle('on',v===t);});
  document.querySelectorAll('.navbtn').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});
  document.getElementById('pageTitle').textContent=TABS[t];
  document.getElementById('pageSub').textContent=t==='overview'?'Учёт расходов на автомобиль':(t==='history'?'Все записи':(t==='garage'?'Автомобили и фото':'Настройки и синхронизация'));
  render(t);}
function render(t){if(t==='overview')renderOverview();else if(t==='history')renderHistory();else if(t==='garage')renderGarage();else renderSettings();}
function renderAll(){render(curTab);}

function avatarHTML(car,cls){cls=cls||'avatar';
  if(car.photo)return '<img class="'+cls+'" src="'+car.photo+'" alt="">';
  var ini=esc((car.brand||'?').slice(0,2).toUpperCase());
  return '<div class="'+cls+'" style="background:'+esc(car.color||'#9fe3c4')+'">'+ini+'</div>';
}

function renderOverview(){
  var el=document.getElementById('view-overview');var car=activeCar();
  if(!car){el.innerHTML='<div class="card"><div class="empty"><div class="big">🚗</div><b>Добавьте автомобиль</b><p class="hint">Чтобы вести расходы, сначала создайте машину в разделе «Гараж».</p></div><button class="btn btn-primary btn-block" onclick="switchTab(\'garage\')">Перейти в гараж</button></div>';return;}
  var fs=fuelStats(car);var key=monthKey(todayISO());
  var mc=monthCat(car,key);
  var catsHtml=CATS.filter(function(c){return mc[c.k];}).map(function(c){return '<span class="chip on">'+c.i+' '+esc(c.l)+' · '+money(mc[c.k])+'</span>';}).join('')||'<span class="hint">В этом месяце расходов ещё нет</span>';
  var months=[];for(var i=5;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleString('ru',{month:'short'})});}
  var maxV=0;months.forEach(function(m){m.v=monthTotal(car,m.k);if(m.v>maxV)maxV=m.v;});
  var chart=months.map(function(m){return '<div class="col"><div class="barv" style="height:'+Math.max(4,maxV?m.v/maxV*100:0)+'%" title="'+m.l+': '+money(m.v)+'"></div><div class="ml">'+m.l+'</div></div>';}).join('');
  var fuelLine=fs.hasOdo&&fs.avg>0?num(fs.avg)+' л/100 км':'—';
  var remainHtml='';
  if(fs.remainPct!=null){remainHtml='<div class="stat" style="grid-column:1/-1"><div class="l">Топливо в баке (оценка)</div><div class="bar"><div style="width:'+Math.round(fs.remainPct)+'%"></div></div><div class="v" style="font-size:15px">'+num(fs.remainL,1)+' л из '+num(car.tank,0)+' л ('+Math.round(fs.remainPct)+'%)</div></div>';}
  var unacc=fs.unaccounted>0?'<p class="hint">После последней полной заправки залито ещё '+num(fs.unaccounted,1)+' л — они попадут в расчёт при следующей заправке «до полного».</p>':'';
  el.innerHTML=
   '<div class="card"><div style="display:flex;gap:14px;align-items:center">'+avatarHTML(car)+
   '<div style="flex:1;min-width:0"><div class="carname">'+esc(car.brand+' '+car.model)+'</div><div class="caryear">'+(car.year?esc(car.year)+' г. · ':'')+'<span class="colordot" style="background:'+esc(car.color||'#9fe3c4')+'"></span></div></div></div></div>'+
   '<div class="grid2" style="margin-bottom:16px">'+
     '<div class="stat"><div class="l">Расходы за месяц</div><div class="v">'+money(monthTotal(car,key))+'</div></div>'+
     '<div class="stat"><div class="l">Всего</div><div class="v">'+money(allTotal(car))+'</div></div>'+
     '<div class="stat"><div class="l">Расход топлива</div><div class="v">'+fuelLine+'</div></div>'+
     '<div class="stat"><div class="l">Стоимость км</div><div class="v">'+(fs.costKm>0?num(fs.costKm,2)+' \u20BD':'—')+'</div></div>'+
     '<div class="stat"><div class="l">Заправлено всего</div><div class="v">'+num(fs.totalLiters,1)+' л</div></div>'+

function compressToDataURL(dataURL){
  return new Promise(function(res,rej){
    var img=new Image();img.onload=function(){
      var max=720,s=Math.min(1,max/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{res(cv.toDataURL('image/jpeg',0.82));}catch(e){rej(e);}
    };img.onerror=rej;img.src=dataURL;});
}
function uploadPhoto(input){
  var f=input.files[0];if(!f)return;
  var rd=new FileReader();rd.onload=function(){
    compressToDataURL(rd.result).then(function(d){
      var c=state.cars.filter(function(x){return x.id===editingCar;})[0];
      if(c){c.photo=d;save();renderAll();toast('Фото загружено ✔');}
      openCarModal(editingCar);
    }).catch(function(){toast('Не удалось обработать фото');});
  };
  rd.readAsDataURL(f);
}
async function findPhotosBtn(){

  var grid=document.getElementById('photoGrid');grid.innerHTML='<p class="hint">Ищу фото…</p>';foundPhotos=[];
  var q=encodeURIComponent((brand+' '+model+' car').trim());
  try{
    var r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap%20'+q+'&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|mime&iiurlwidth=520&format=json&origin=*');
    var d=await r.json();
    if(d.query&&d.query.pages){Object.keys(d.query.pages).forEach(function(k){var p=d.query.pages[k];
      if(p.imageinfo&&p.imageinfo[0]&&/image\/(jpeg|png)/.test(p.imageinfo[0].mime))foundPhotos.push(p.imageinfo[0].thumburl||p.imageinfo[0].url);});}
  }catch(e){}
  if(!foundPhotos.length){
    try{
      var r2=await fetch('https://ru.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(brand+' '+model)+'&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json&origin=*');
      var d2=await r2.json();var pages=d2.query&&d2.query.pages;

    }catch(e){}
  }
  if(!foundPhotos.length){grid.innerHTML='<p class="hint">Фото не нашлись. Попробуйте уточнить модель или загрузите снимок с телефона.</p>';return;}

function saveRecord(carId){
  var car=null;state.cars.forEach(function(c){if(c.id===carId)car=c;});

    });});

function syncReady(){return settings.syncToken&&settings.syncGistId&&settings.syncOn;}
function authHeaders(){return{'Authorization':'token '+settings.syncToken,'Content-Type':'application/json','Accept':'application/vnd.github+json'};}
var pushTimer=null;
function schedulePush(){if(!syncReady())return;clearTimeout(pushTimer);pushTimer=setTimeout(function(){pushToCloud(true);},4000);}
async function pushToCloud(silent){
  if(!settings.syncToken){if(!silent)toast('Сначала подключите токен');return;}
  try{
    var content=JSON.stringify(state);
    var opts;
    if(!settings.syncGistId){
      opts={method:'POST',headers:authHeaders(),body:JSON.stringify({description:'Car Expenses — данные приложения',public:false,files:{'car-expenses.json':{content:content}}})};
    }else{
      opts={method:'PATCH',headers:authHeaders(),body:JSON.stringify({files:{'car-expenses.json':{content:content}}})};
    }
    var r=await fetch('https://api.github.com/gists'+(settings.syncGistId?'/'+settings.syncGistId:''),opts);
    if(!r.ok){
      if(r.status===401)toast('Токен недействителен — проверьте его в разделе «Ещё»');
      else if(r.status===404)toast('Хранилище не найдено — переподключите синхронизацию');
      else toast('Ошибка GitHub: '+r.status);
      return;
    }
    var d=await r.json();
    if(d.id&&!settings.syncGistId){settings.syncGistId=d.id;saveSettings();}
    settings.lastSync=Date.now();saveSettings();
    if(!silent)toast('Данные выгружены в облако');
    if(curTab==='settings')renderSettings();
  }catch(e){if(!silent)toast('Нет соединения с GitHub');}
}
async function pullFromCloud(silent){
  if(!syncReady())return false;
  try{
    var r=await fetch('https://api.github.com/gists/'+settings.syncGistId,{headers:authHeaders()});
    if(!r.ok){if(!silent)toast(r.status===401?'Токен недействителен':'Хранилище недоступно');return false;}
    var d=await r.json();
    var f=d.files&&d.files['car-expenses.json'];
    if(!f){if(!silent)toast('В хранилище нет данных');return false;}
    var cloud=JSON.parse(f.content);
    if(!cloud||!cloud.cars){if(!silent)toast('Формат данных не распознан');return false;}
    if((cloud.updatedAt||0)>=(state.updatedAt||0)){
      state=cloud;try{localStorage.setItem('carExpV1',JSON.stringify(state));}catch(e){}
      settings.lastSync=Date.now();saveSettings();
      if(!silent)toast('Данные загружены из облака');
      renderAll();return true;
    }else{
      pushToCloud(true);
      if(!silent)toast('Здесь данные новее — выгрузил в облако');
      return true;
    }
  }catch(e){if(!silent)toast('Нет соединения с GitHub');return false;}
}
async function connectSync(){
  var t=document.getElementById('syncToken').value.trim();
  if(!t){toast('Вставьте токен доступа');return;}
  toast('Проверяю токен…');
  try{
    var r=await fetch('https://api.github.com/user',{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json'}});
    if(!r.ok){toast(r.status===401?'Токен отклонён GitHub':'Ошибка GitHub: '+r.status);return;}
    var u=await r.json();
    settings.syncToken=t;settings.syncOn=true;saveSettings();
    await pushToCloud(false);
    toast('Синхронизация включена ('+u.login+')');
    renderSettings();
  }catch(e){toast('Нет соединения с GitHub');}
}
function disconnectSync(){
  if(!confirm('Отключить синхронизацию? Локальные данные останутся.'))return;
  settings.syncToken='';settings.syncGistId='';settings.syncOn=false;settings.lastSync=0;saveSettings();renderSettings();toast('Синхронизация отключена');
}
function renderSettings(){
  var el=document.getElementById('view-settings');
  var on=syncReady();
  var last=settings.lastSync?new Date(settings.lastSync).toLocaleString('ru'):'—';
  el.innerHTML=
   '<div class="card"><h3>Синхронизация данных</h3>'+
   (on
    ?'<div class="checkline"><button class="switch on" id="autoSync" onclick="this.classList.toggle(\'on\');settings.syncOn=this.classList.contains(\'on\');saveSettings()"></button>Автообмен включён</div>'+
     '<p class="sync-status">Хранилище: приватный Gist GitHub<br>Последняя синхронизация: '+last+'</p>'+
     '<div class="row" style="margin-top:14px"><button class="btn btn-sm" onclick="pushToCloud(false)">Выгрузить сейчас</button><button class="btn btn-sm" onclick="pullFromCloud(false)">Загрузить из облака</button></div>'+
     '<button class="btn btn-sm btn-danger" style="margin-top:10px" onclick="disconnectSync()">Отключить синхронизацию</button>'
    :'<p class="hint">Данные каждого телефона хранятся в его браузере. Синхронизация объединяет их через ваш GitHub: создаётся приватный Gist, куда приложение выгружает изменения, а другие устройства подхватывают их при запуске.</p>'+
     '<label>Токен доступа GitHub</label><input class="field" type="password" id="syncToken" value="'+esc(settings.syncToken)+'" placeholder="ghp_…">'+
     '<p class="hint">Как получить: GitHub → Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b> → Generate new token — отметьте только право <b>gist</b>. Токен хранится только на этом телефоне и отправляется лишь на серверы GitHub.</p>'+
     '<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="connectSync()">Подключить и создать хранилище</button>')+
   '</div>'+
   '<div class="card"><h3>Резервная копия</h3><p class="hint">CSV открывается в Excel — резервная копия на случай очистки браузера.</p><button class="btn btn-block" style="margin-top:10px" onclick="exportCSV()">Экспорт в CSV</button></div>'+
   '<div class="card"><h3>Опасная зона</h3><button class="btn btn-danger btn-block btn-sm" onclick="wipeAll()">Удалить все данные</button></div>';
}
function wipeAll(){
  if(!confirm('Удалить ВСЕ автомобили и записи без возможности возврата?'))return;
  state={cars:[],activeCar:null,updatedAt:Date.now()};try{localStorage.setItem('carExpV1',JSON.stringify(state));}catch(e){}
  schedulePush();renderAll();toast('Данные удалены');
}

function closeModal(){document.getElementById('overlay').classList.remove('on');}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

document.querySelectorAll('.navbtn').forEach(function(b){b.onclick=function(){switchTab(b.dataset.tab);};});
document.getElementById('fabBtn').onclick=function(){var car=activeCar();if(!car){toast('Сначала добавьте автомобиль в гараже');switchTab('garage');return;}openRecordModal(car,null);};
if(settings.syncOn&&settings.syncToken&&settings.syncGistId){pullFromCloud(true);}
switchTab('overview');
</script>
